name: Semgrep core integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-semgrep-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-11-01
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: .github/workflows/semgrep-core.yml
      - name: Run corpus against bundled Semgrep core 1.181.0
        run: uv run --no-project --with semgrep==1.181.0 -- bash scripts/test-semgrep-core.sh
