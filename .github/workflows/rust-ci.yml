name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-11-01
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Locate pinned Semgrep Core
        run: |
          core="$(uv run --no-project --with semgrep==1.181.0 -- python -c 'from pathlib import Path; import semgrep; print(Path(semgrep.__file__).parent / "bin" / "semgrep-core")')"
          test -x "$core"
          "$core" -version
          echo "REPODB_SEMGREP_CORE=$core" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1
