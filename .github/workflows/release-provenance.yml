name: Build and attest release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable as of 2026-11-01
        with:
          toolchain: stable
      - name: Package crate
        run: cargo package --locked --no-verify
      - name: Build release binary
        run: cargo build --locked --release
      - name: Collect checksummed artifacts
        run: |
          mkdir -p dist
          cp target/package/*.crate dist/
          install -m 0644 target/release/repodb dist/repodb-linux-x86_64
          (cd dist && sha256sum *.crate repodb-linux-x86_64 > SHA256SUMS.txt)
      - name: Upload workflow artifact (not a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repodb-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          push-to-registry: false
          subject-path: |
            dist/*.crate
            dist/repodb-linux-x86_64
            dist/SHA256SUMS.txt
