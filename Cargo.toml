[package]
name = "repodb"
version = "0.3.1"
edition = "2024"
license = "GPL-2.0-only"
exclude = [
    ".scratch/**",
    "AGENTS.md",
    "benchmarks/**",
    "docs/issue-*",
    "docs/research/**",
    "docs/reviews/security/**",
    "docs/reviews/standards/**",
    "hooks/**",
    "package.json",
    "scripts/bench_issue_32.sh",
    "scripts/benchmark-refresh-resources.sh",
    "standards/**",
]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "repodb"
path = "src/main.rs"
